name: Banner teaching refresh

on:
  schedule:
    - cron: "0 8 * * 1"   # Mondays 08:00 UTC — see cadence note in docs
  workflow_dispatch:

# Only one refresh at a time: two overlapping runs would scrape and replace the
# same terms, each checking its gates against a baseline the other is about to
# overwrite. Queue rather than cancel — a cancelled run can stop between the
# section load and the match, leaving banner_sections fresh while
# professor_teaching and the history tables still describe the previous one.
concurrency:
  group: banner-refresh
  cancel-in-progress: false

# Nothing here reads or writes the repo through GITHUB_TOKEN; the only
# credential used is the CRDB secret.
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Measured cold full-term run 2026-08-04: 11m57s at concurrency 4. The
    # weekly run now uses 2 (gentler on the live registration system), which
    # roughly doubles that per term, and a week where a term closes adds one
    # more full-term scrape on top of the open terms.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt
      - name: Offline selftest
        id: selftest
        run: cd scraper && python load_banner_to_crdb.py --selftest
      # A refused term makes this step fail, but the steps below still run
      # (`!cancelled()`, once the selftest has passed): the other terms were written, and skipping the
      # matcher would leave banner_sections fresh while professor_teaching and
      # the history tables describe the previous run. A chip whose own term
      # keeps failing still goes stale, because the matcher stamps it with
      # that term's last scrape, not with its own clock.
      # A rate limit (exit 75) is different: the client's rule is to stop
      # and re-probe later, so finalize, which scrapes Banner again, is
      # skipped. The matcher reads only the database and still runs.
      - name: Refresh open terms
        id: refresh
        env:
          CRDB_DATABASE_URL: ${{ secrets.CRDB_DATABASE_URL }}
        run: |
          cd scraper
          set +e
          python load_banner_to_crdb.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      # A term that closed since last week was last scraped while still open;
      # give it one final scrape. History before that is already stored and
      # closed terms never change, so most weeks this finds nothing to do.
      - name: Finalize newly closed terms
        if: ${{ !cancelled() && steps.selftest.outcome == 'success' && steps.refresh.outputs.exit_code != '75' }}
        env:
          CRDB_DATABASE_URL: ${{ secrets.CRDB_DATABASE_URL }}
        run: cd scraper && python load_banner_to_crdb.py --backfill
      - name: Build teaching chip and course history
        if: ${{ !cancelled() && steps.selftest.outcome == 'success' }}
        env:
          CRDB_DATABASE_URL: ${{ secrets.CRDB_DATABASE_URL }}
        run: cd scraper && python match_banner_instructors.py
