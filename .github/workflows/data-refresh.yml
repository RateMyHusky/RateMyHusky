name: Data Refresh

on:
  schedule:
    - cron: "0 10 * * 0"  # 10:00 UTC every Sunday
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scrape + sanity checks only — skip DB writes and the data-store push"
        type: boolean
        default: true
      accept_lower_counts:
        description: "Skip the relative (vs last week) floors; absolute floors still apply"
        type: boolean
        default: false

# ci.yml is read-only too; the job that writes prod gets no more than it does.
permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false  # queue a manual dispatch behind the cron, never kill a mid-write run

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # match ci.yml — prod writes run the tested interpreter
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-data.txt

      # Pull the CSV data store (photos, course listings, previous RMP data) into
      # output_data. The RMP scrape below overwrites rmp_professors.csv /
      # rmp_reviews.csv with fresh data.
      - name: Fetch data store
        env:
          RMH_DATA_TOKEN: ${{ secrets.RMH_DATA_TOKEN }}
          RMH_DATA_REPO: ${{ secrets.RMH_DATA_REPO }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${RMH_DATA_TOKEN}@github.com/${RMH_DATA_REPO}.git" \
            backend/Better_Scraper/output_data

      # Snapshot last week's row counts BEFORE the scrape overwrites the CSVs.
      # Written to RUNNER_TEMP, not into output_data, so the store push at the
      # end can't commit it. A file absent from the store is left out of the
      # baseline entirely, which makes `check` fall back to absolute floors for
      # it rather than comparing against a phantom 0.
      - name: Record previous data-store counts
        working-directory: backend
        run: |
          python Better_Scraper/scrape_guard.py baseline \
            --data-dir Better_Scraper/output_data \
            --out "$RUNNER_TEMP/baseline.json"

      # If RMP starts 403/429-ing the runner's datacenter IP, enable the token
      # bucket without a code change — uncomment the two lines below.
      - name: RMP scrape
        working-directory: backend
        # env:
        #   RMP_RATE_LIMIT_RPS: "5"
        run: |
          python Better_Scraper/fetch_lite.py \
            -s 696 \
            --file_path Better_Scraper/output_data/rmp_professors.csv

      # Guardrail: a broken/rate-limited scrape must not overwrite good data.
      # scrape_guard enforces both layers over every file — absolute floors
      # (~80% of healthy, covering the first run) and a 98% floor against the
      # baseline above, which catches degraded scrapes that clear the absolute
      # floor anyway. It also fails on a missing file precompute.py reads, which
      # would otherwise crash it mid-run with the RMP load already written.
      # Logic and tests live in backend/tests/test_scrape_guard.py, so ci.yml
      # exercises it on every push.
      - name: Sanity check scrape
        working-directory: backend
        env:
          ACCEPT_LOWER: ${{ inputs.accept_lower_counts }}
        run: |
          accept_flag=""
          if [ "$ACCEPT_LOWER" = "true" ]; then
            accept_flag="--accept-lower"
          fi
          python Better_Scraper/scrape_guard.py check \
            --data-dir Better_Scraper/output_data \
            --baseline "$RUNNER_TEMP/baseline.json" \
            $accept_flag

      # The two RMP tables are loaded differently on purpose.
      #
      # rmp_professors is full-replaced every run: 3,889 rows, and its columns
      # are aggregates RMP recomputes constantly (rating, num_ratings,
      # would_take_again_pct), which an upsert's DO NOTHING would never update.
      # The TRUNCATE and the reload commit as one transaction (load_rmp.load_table),
      # and nothing in the request path reads this table anyway — only
      # pipeline.run, later in this job. No foreign key or source_ref points at its ids.
      #
      # rmp_reviews is upserted, then pruned by the next step. It must NOT be
      # truncated: evidence.source_ref for RMP is the review's id
      # (scraper/load_evidence.py, build_rmp_rows), so regenerating ids orphans the
      # RMP half of the RAG corpus and forces a re-embed. A TRUNCATE would also lock
      # a table the site reads on every professor page for the whole reload.
      - name: Load fresh RMP rows
        if: ${{ !inputs.dry_run }}
        working-directory: backend
        env:
          ORACLE_DATABASE_URL: ${{ secrets.ORACLE_DATABASE_URL }}
        run: |
          python load_rmp.py rmp_professors --replace
          python load_rmp.py rmp_reviews

      # Reviews deleted on RMP have to leave the table too, or the list keeps
      # rendering rows the count beside it (rebuilt from the DB by
      # pipeline.run) has already dropped. Runs before pipeline.run so the reviews
      # and the counts describe the same set. Refuses to delete more than 1% of
      # the table without --force; the real weekly delta is tens of rows (~0.1%).
      # The ceiling is deliberately under the 2% loss scrape_guard tolerates, so
      # a degraded scrape that clears the guard stops here instead of having its
      # missing rows read as RMP deletions.
      - name: Prune reviews deleted on RMP
        if: ${{ !inputs.dry_run }}
        working-directory: backend
        env:
          ORACLE_DATABASE_URL: ${{ secrets.ORACLE_DATABASE_URL }}
        run: |
          python prune_rmp_reviews.py \
            --csv Better_Scraper/output_data/rmp_reviews.csv

      # Rebuilds the read models from the fresh rows and bumps data_version, which
      # retires every cached page. One transaction: the site sees the old models
      # until it commits. Exits non-zero, writing nothing, if verify fails.
      - name: Rebuild read models
        if: ${{ !inputs.dry_run }}
        working-directory: backend
        env:
          ORACLE_DATABASE_URL: ${{ secrets.ORACLE_DATABASE_URL }}
        run: python -m pipeline.run

      # Post-write verification: the pre-scrape floors validate the input CSVs;
      # this validates what actually landed in the DB. Runs BEFORE the store
      # push so a bad DB state also blocks overwriting the data store.
      - name: Verify DB state after write
        if: ${{ !inputs.dry_run }}
        working-directory: backend
        env:
          ORACLE_DATABASE_URL: ${{ secrets.ORACLE_DATABASE_URL }}
        run: |
          python - <<'EOF'
          import os, sys, psycopg2
          conn = psycopg2.connect(os.environ["ORACLE_DATABASE_URL"], sslmode="require")
          cur = conn.cursor()
          cur.execute("SELECT count(*) FROM professors_catalog")
          n = cur.fetchone()[0]
          print(f"professors_catalog: {n} rows")
          if n < 3000:
              print(f"::error::professors_catalog has only {n} rows after pipeline.run (< 3000). Store push skipped; investigate before re-running.")
              sys.exit(1)
          cur.execute("SELECT count(*) FROM (SELECT 1 FROM rmp_reviews WHERE name_key IS NULL LIMIT 1001) AS probe")
          nulls = cur.fetchone()[0]
          if nulls:
              shown = "1000+" if nulls > 1000 else nulls
              print(f"::warning::rmp_reviews has {shown} NULL name_key rows after pipeline.run.")
          conn.close()
          EOF

      # Commit the refreshed CSVs back as a single squashed commit (orphan
      # branch) so the data store stays a flat snapshot rather than growing
      # history on every weekly run.
      - name: Push refreshed data back to store
        if: ${{ !inputs.dry_run }}
        working-directory: backend/Better_Scraper/output_data
        env:
          RMH_DATA_TOKEN: ${{ secrets.RMH_DATA_TOKEN }}
          RMH_DATA_REPO: ${{ secrets.RMH_DATA_REPO }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan refreshed
          git add -A
          git commit -q -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git branch -D main
          git branch -m main
          git push -f \
            "https://x-access-token:${RMH_DATA_TOKEN}@github.com/${RMH_DATA_REPO}.git" \
            main

  # A failed refresh can leave prod stale or half-written with nothing on the
  # site to say so, and GitHub's own failure email only reaches whoever started
  # the run. Open an issue instead, so the failure reaches everyone watching the
  # repo and stays open until someone deals with it. Repeat failures comment on
  # the open issue rather than stacking new ones. A separate job, so only this
  # step gets write access: the job that writes prod keeps its read-only token.
  notify-failure:
    needs: refresh
    # Not failure(): a job that hits timeout-minutes ends as cancelled, and a
    # timeout is the likeliest way a run dies mid-write. A run cancelled by hand
    # partway through a prod write deserves an alert too. Dry runs never touch
    # prod, and whoever dispatched one is watching it.
    if: ${{ always() && needs.refresh.result != 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.refresh.result }}
        run: |
          title="Data refresh failed"
          # No --search (its index lags a just-created issue) and no pipe (a
          # failed gh call must fail the step, not read as "no open issue").
          existing=$(gh issue list --state open --limit 200 --json number,title \
            -q "[.[] | select(.title == \"$title\")][0].number // empty")
          body="A data refresh run ended as $RESULT: $RUN_URL

          Check which step failed. If it was at or after \"Load fresh RMP rows\", prod may hold partially refreshed data: RMP reviews may already be upserted, and if \"Verify DB state after write\" failed, the site is already serving the data that failed the check. If it failed earlier, prod is untouched and the site keeps serving the last good RMP data."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
