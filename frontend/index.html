<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NY3WJ7WEKL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      if (navigator.webdriver) gtag('set', 'user_properties', { automated_browser: 'yes' });
      gtag('config', 'G-NY3WJ7WEKL');
      // One real_visit per page load, on the first click, tap, key press or
      // mouse-wheel scroll a person makes (isTrusted skips events dispatched by
      // page scripts; a touch scroll starts with a pointerdown).
      (function () {
        var types = ['pointerdown', 'keydown', 'wheel'];
        function onAct(e) {
          if (!e.isTrusted) return;
          types.forEach(function (t) { removeEventListener(t, onAct, true); });
          gtag('event', 'real_visit');
        }
        types.forEach(function (t) { addEventListener(t, onAct, { capture: true, passive: true }); });
      })();
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8182927478614560"
         crossorigin="anonymous"></script>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="index, follow" />

    <!-- Constant fallbacks only. Per-page title/description/og:type/url and
         JSON-LD are set at runtime by <Seo>. We intentionally do NOT put a
         description or og:title/description/url/type here, so React 19 owns
         them per route without producing duplicate tags. -->
    <meta property="og:site_name" content="RateMyHusky" />
    <meta property="og:image" content="https://ratemyhusky.com/logo.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://ratemyhusky.com/logo.jpg" />

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <title>RateMyHusky</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
